<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buscador de Anillos</title><style>:root{--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6b7280;--primary:#0b79d0;--primary-600:#0863ab;--ok:#15803d;--err:#b91c1c;--ring:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:720px;margin:32px auto;padding:0 16px}.logo{display:block;margin:0 auto 16px;max-width:220px;width:40%;min-width:140px;border-radius:8px}h1{font-size:28px;line-height:1.2;text-align:center;margin:8px 0 6px}.sub{color:var(--muted);text-align:center;margin:0 0 20px}.card{background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.04)}form{display:flex;flex-direction:column;gap:12px;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}input[type=number],select{padding:12px 14px;border:1px solid var(--ring);border-radius:10px;font-size:16px;min-width:260px;background:#fff;outline:none}input[type=number]:focus,select:focus{border-color:var(--primary)}button{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;transition:transform .02s ease,background .2s ease}button:active{transform:translateY(1px)}button:hover{background:var(--primary-600)}.res{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--ring);text-align:center}.ok{color:var(--ok);background:#f0fdf4;border-color:#bbf7d0}.err{color:var(--err);background:#fef2f2;border-color:#fecaca}.muted{color:var(--muted);font-size:14px;text-align:center;margin-top:10px}.range{font-size:14px;color:#374151}footer{margin:24px 0 8px;text-align:center;color:var(--muted);font-size:12px}</style></head><body><div class="wrap"><img src="centro.png" alt="Logo del club" class="logo"><h1>Anillos Asociacion Colombofila Centro Republica</h1><p class="sub">Ingresá el número del anillo y seleccioná el año</p><div class="card"><form id="frm"><div class="row"><input type="number" id="numeroAnillo" inputmode="numeric" placeholder="Ej: 1736055" required><select id="anio" aria-label="Año"></select></div><button type="submit">Buscar</button></form><div id="resultado" class="res muted">Ingresá un número y presioná Buscar o Enter.</div></div><footer>ACC Republica&nbsp;&nbsp; Consulta de anillos</footer></div><script>const $=s=>document.querySelector(s),res=$("#resultado"),input=$("#numeroAnillo"),sel=$("#anio");let datos=[];const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pintaMsg(html,ok){res.className='res '+(ok?'ok':'err');res.innerHTML=html}async function cargar(){try{const r=await fetch('data/anillos.json',{cache:'no-store'});if(!r.ok)throw new Error();datos=await r.json();const years=[...new Set(datos.map(x=>Number(x.anio)).filter(Boolean))].sort((a,b)=>a-b);sel.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');if(!years.length)pintaMsg('No hay años cargados.',false)}catch(e){pintaMsg('No se pudieron cargar los datos.',false)}}function buscar(){const numero=(input.value||'').trim(),anio=(sel.value||'').trim();pintaMsg('Buscando…',true);if(!numero||isNaN(Number(numero))){pintaMsg('Por favor ingresá un número válido.',false);input.focus();return}const n=Number(numero),y=Number(anio),d=datos.find(x=>Number(x.anio)===y&&n>=Number(x.desde)&&n<=Number(x.hasta));if(d){let html=`Este anillo pertenece a: <strong>${esc(d.socio||'')}</strong>`;html+=`<div class="range">Rango: ${d.desde} – ${d.hasta}</div>`;if(d.nota)html+=`<div class="range">Nota: ${esc(d.nota)}</div>`;pintaMsg(html,true)}else pintaMsg('Anillo no encontrado en la base de datos.',false);res.scrollIntoView({behavior:'smooth',block:'center'})}$('#frm').addEventListener('submit',e=>{e.preventDefault();buscar()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buscar()}});cargar();</script></body></html>
